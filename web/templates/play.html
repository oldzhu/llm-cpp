<div class="play-panel">
  <div class="play-sidebar">
    <h3 data-i18n="play.model">Model</h3>
    <select id="play-model-select">
      <option value="" data-i18n="play.selectCkpt">-- Select checkpoint --</option>
    </select>
    <div id="play-model-info" class="play-model-info"></div>
    <div class="play-params">
      <label><span data-i18n="play.temp">Temperature</span> <input type="range" id="play-temp" min="0.1" max="2.0" step="0.1" value="0.8"><span id="play-temp-val">0.8</span></label>
      <label><span data-i18n="play.topk">Top-K</span> <input type="range" id="play-topk" min="1" max="200" step="1" value="40"><span id="play-topk-val">40</span></label>
      <label><span data-i18n="play.gen">Max Tokens</span> <input type="range" id="play-gen" min="10" max="500" step="10" value="100"><span id="play-gen-val">100</span></label>
    </div>
    <button id="play-load-btn" class="btn btn-start" onclick="playUI.loadModel()" data-i18n="play.load">Load Model</button>
    <button id="play-clear-btn" class="btn btn-cancel" onclick="playUI.clear()" data-i18n="play.clear">Clear</button>
  </div>
  <div class="play-chat">
    <div id="play-messages" class="play-messages">
      <div class="play-placeholder" data-i18n="play.placeholder">Select a checkpoint and click Load Model to start chatting</div>
    </div>
    <div class="play-input-row">
      <textarea id="play-input" data-i18n="play.inputPH" placeholder="Type a message..." rows="2"></textarea>
      <button onclick="playUI.send()" id="play-send-btn" disabled data-i18n="play.send">Send</button>
    </div>
  </div>
</div>
