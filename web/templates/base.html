<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>build-llm-using-cpp Trainer</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div id="app">
  <nav id="tabs">
    <button class="tab active" data-tab="config" data-i18n-nav="config">⚙ Config</button>
    <button class="tab" data-tab="monitor" data-i18n-nav="monitor">📊 Monitor</button>
    <button class="tab" data-tab="code" data-i18n-nav="code">📁 Code</button>
    <button class="tab" data-tab="chat" data-i18n-nav="chat">🤖 AI Chat</button>
    <button class="tab" data-tab="learn" data-i18n-nav="learn">📖 Learn</button>
    <button class="tab" data-tab="play" data-i18n-nav="play">💬 Play</button>
    <span class="nav-spacer"></span>
    <button class="tab icon-tab" id="settings-gear-code" title="AI Settings" style="display:none">⚙</button>
    <button class="tab icon-tab" id="settings-gear-chat" title="AI Settings" style="display:none">⚙</button>
    <button class="tab icon-tab" id="lang-toggle" onclick="toggleLang()">中文</button>
  </nav>

  <div id="content">
    <div id="tab-config" class="tab-panel active">{% include 'config.html' %}</div>
    <div id="tab-monitor" class="tab-panel">{% include 'monitor.html' %}</div>
    <div id="tab-code" class="tab-panel">{% include 'code.html' %}</div>
    <div id="tab-chat" class="tab-panel">{% include 'chat.html' %}</div>
    <div id="tab-learn" class="tab-panel">{% include 'learn.html' %}</div>
    <div id="tab-play" class="tab-panel">{% include 'play.html' %}</div>
  </div>

  <footer id="status-bar">
    <span id="status-indicator" class="dot idle"></span>
    <span id="status-text" data-i18n="status.ready">Ready</span>
    <span id="status-step"></span>
  </footer>
</div>
<script src="/static/i18n.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/architecture.js"></script>
<script src="/static/app.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/code.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/play.js"></script>
</body>
</html>
